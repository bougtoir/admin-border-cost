    京都1区: ["京都市北区", "京都市上京区", "京都市中京区", "京都市下京区", "京都市南区"]
    京都2区: ["京都市左京区", "京都市東山区", "京都市山科区"]
    京都3区: ["京都市伏見区", "向日市", "長岡京市", "大山崎町"]
