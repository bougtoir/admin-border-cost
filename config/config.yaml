    京都5区: ["福知山市", "舞鶴市", "綾部市", "宮津市", "京丹後市", "伊根町", "与謝野町"]
    京都6区: ["宇治市", "城陽市", "八幡市", "京田辺市", "木津川市", "久御山町", "井手町", "宇治田原町", "笠置町", "和束町", "精華町", "南山城村"]

optimization:
  tau_primary: 0.20
  tau_sensitivity: [0.10, 0.15, 0.30]
  weights_primary: {pop: 1.0, compact: 0.3, split: 0.3, flow: 0.3}
  pareto_weight_grid:
    compact: [0.0, 0.1, 0.3, 0.6, 1.0]
    split: [0.0, 0.3]
    flow: [0.0, 0.1, 0.3, 0.6, 1.0]
  seeds: [11, 23, 37, 41, 53, 67, 79, 97]
  time_limit_level_a_sec: 300
  time_limit_level_b_sec: 600
  workers: 8

flows:
  primary_normalization: "symmetric"  # F_ij=(C_ij+C_ji)/2
  sensitivity_normalizations: ["raw_bidirectional", "origin_normalized", "population_symmetric"]

placebo:
  n_borders: 200
  pop_split_tol: 0.10
  boundary_len_tol: 0.50
  match_boundary_length_tol: 0.30
  time_limit_sec: 60

robustness:
  projection_years: [2025, 2030, 2035, 2040, 2045, 2050]
  durability_threshold_tau: 0.20
